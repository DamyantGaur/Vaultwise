# Vaultwise CI
#  1. test   - lint, unit/API tests, and the AI quality gate (re-scores stored evaluation outputs)
#  2. build  - builds the Docker image, starts the container and checks that it serves the app
# Runs on every push and pull request. Any failure marks the commit red, so a broken or lower-quality
# change is caught before it is merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.8.4
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Re-score stored evaluation outputs with the current code
        run: |
          python eval/report.py > /dev/null
          python eval/run_private_eval.py report > /dev/null
      - name: AI quality gate
        run: python eval/quality_gate.py

  build:
    name: Docker build and start-up check
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t vaultwise:ci .
      - name: Start the container
        run: docker run -d --name vaultwise -p 8000:8000 vaultwise:ci
      - name: Check that the app and its API respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          grep -q '"status":"ok"' health.json
          curl -sf http://localhost:8000/ | grep -q "<title>Vaultwise</title>"
          echo "Container serves /health and the dashboard"
      - name: Container logs
        if: always()
        run: docker logs vaultwise 2>&1 | tail -n 40 || true
