# Vaultwise CI
#  1. test     - lint, unit/API tests, and the AI quality gate (re-scores stored evaluation outputs)
#  2. startup  - installs the app the way a user does and checks that the server starts and responds
# Runs on every push and pull request. Any failure marks the commit red, so a broken or lower-quality
# change is caught before it is merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.8.4
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Re-score stored evaluation outputs with the current code
        run: |
          python eval/report.py > /dev/null
          python eval/run_private_eval.py report > /dev/null
      - name: AI quality gate
        run: python eval/quality_gate.py

  startup:
    name: App start-up check
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start the server
        run: |
          python -m uvicorn vaultwise.api:app --app-dir src --host 127.0.0.1 --port 8000 > server.log 2>&1 &
      - name: Check that the API and dashboard respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"status":"ok"' health.json
          curl -sf http://127.0.0.1:8000/ | grep -q "<title>Vaultwise</title>"
          echo "Server starts and serves /health and the dashboard"
      - name: Server log
        if: always()
        run: tail -n 40 server.log || true
