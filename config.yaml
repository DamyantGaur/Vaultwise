# Vaultwise configuration. Every experiment reads this file; results/ records a copy of it.

corpus_dir: data/corpus     # the company policy set used for the evaluation

# Private data: documents you add from the web UI (contracts, policies shared with you, confidential files),
# the search index built from them, and logs. Kept outside the project folder on purpose: this project lives in
# OneDrive, which would otherwise copy confidential files to the cloud. Override with env VAULTWISE_DATA_DIR.
private_dir: ~/.vaultwise
upload_dir: "{private_dir}/uploads"
index_dir: "{private_dir}/index"
log_dir: "{private_dir}/logs"

privacy:
  allow_remote_llm: false    # refuse to send document text to a model server that is not on this machine
  log_private_text: false    # for questions about your own documents, log timing only, never question/answer text

ollama:
  base_url: http://localhost:11434
  timeout_s: 300

chunking:
  strategy: section         # section | fixed | document (see ingest.chunk_documents)
  chunk_size_words: 120     # max words per chunk (section-aware; a section is split only if longer)
  overlap_words: 30

embedding:
  model: nomic-embed-text
  query_prefix: "search_query: "        # nomic-embed-text task prefixes
  document_prefix: "search_document: "
  batch_size: 32

retrieval:
  top_k: 4                 # chunks passed to the LLM
  candidate_pool: 20       # candidates from each retriever before fusion
  rrf_k: 60                # Reciprocal Rank Fusion constant
  default_mode: hybrid     # bm25 | dense | hybrid

generation:
  model: llama3.2:3b
  temperature: 0.0
  seed: 42
  num_ctx: 4096
  max_tokens: 300
  summary_model: llama3.1:8b  # summaries: the 8B model was accurate on the sample memo where the 3B invented a date
                              # (~95 s vs ~38 s); falls back to `model` if not installed
  summary_max_tokens: 600   # document summaries are longer than answers
  summary_batch_words: 1500 # long documents are summarised in parts of this size, then combined

refusal_message: "I don't have enough information in the company documents to answer that."
